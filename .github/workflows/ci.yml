name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: grimorio, POSTGRES_PASSWORD: ci, POSTGRES_DB: grimorio }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U grimorio" --health-interval 5s
    env:
      DATABASE_URL: postgres://grimorio:ci@localhost:5432/grimorio
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci
      UPLOAD_DIR: /tmp/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @grimorio/db migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright, path: test-results }
