# Deploy no Coolify (build pack "Docker Compose"). O proxy do Coolify (Traefik) faz o papel do Caddy:
# mesmo domínio para web e realtime, para o cookie de sessão valer nos dois.
# Senhas: geradas pelo Coolify (SERVICE_PASSWORD_*). Arquivos: disco (volume uploads), sem MinIO.
# ponytail: domínio fixo nas labels; troque grimorio.belispetre.com aqui e em BETTER_AUTH_URL se mudar.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: grimorio
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: grimorio
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: pg_isready -U grimorio
      interval: 5s

  web:
    build: { context: ., target: web }
    environment: &app
      DATABASE_URL: postgres://grimorio:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/grimorio
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_BETTERAUTH}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://grimorio.belispetre.com}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      realtime: { condition: service_started }
    labels:
      - traefik.enable=true
      - traefik.http.routers.grimorio-web.rule=Host(`grimorio.belispetre.com`)
      - traefik.http.routers.grimorio-web.entryPoints=https
      - traefik.http.routers.grimorio-web.tls=true
      - traefik.http.routers.grimorio-web.tls.certresolver=letsencrypt
      - traefik.http.routers.grimorio-web.service=grimorio-web
      - traefik.http.services.grimorio-web.loadbalancer.server.port=3000
      - traefik.http.routers.grimorio-http.rule=Host(`grimorio.belispetre.com`)
      - traefik.http.routers.grimorio-http.entryPoints=http
      - traefik.http.routers.grimorio-http.middlewares=redirect-to-https
      - traefik.http.routers.grimorio-http.service=grimorio-web

  realtime:
    build: { context: ., target: realtime }
    environment: *app
    depends_on: { postgres: { condition: service_healthy } }
    labels:
      - traefik.enable=true
      - traefik.http.routers.grimorio-rt.rule=Host(`grimorio.belispetre.com`) && (PathPrefix(`/rt`) || PathPrefix(`/collab`))
      - traefik.http.routers.grimorio-rt.priority=100
      - traefik.http.routers.grimorio-rt.entryPoints=https
      - traefik.http.routers.grimorio-rt.tls=true
      - traefik.http.routers.grimorio-rt.tls.certresolver=letsencrypt
      - traefik.http.routers.grimorio-rt.service=grimorio-rt
      - traefik.http.services.grimorio-rt.loadbalancer.server.port=4000

volumes:
  pgdata:
  uploads:
